<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MGG Carnival</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>

<body class="landing-page">

  <div class="background-shapes" aria-hidden="true">
    <div class="blob blob-pink"></div>
    <div class="blob blob-blue"></div>
    <div class="blob blob-orange"></div>
    <div class="blob blob-lime"></div>

    <div class="floating-star star-one">✦</div>
    <div class="floating-star star-two">✦</div>
    <div class="floating-star star-three">✦</div>

    <div class="floating-ball ball-one"></div>
    <div class="floating-ball ball-two"></div>
  </div>

  <main class="landing">

    <div class="real-logo-wrap">
      <img
        src="mgg-logo.png"
        alt="The MGG Society"
        class="real-logo"
      >
    </div>

    <div class="carnival-pill">
      <span class="live-dot"></span>
      MGG CARNIVAL 2026
    </div>

    <h1 class="hero-title">
      READY TO
      <span>PLAY?</span>
    </h1>

    <p class="landing-copy">
      Grab your phone. Pick your answers.
      Beat the room and take the crown.
    </p>

    <div class="landing-buttons">

      <a href="play.html" class="button button-primary bounce-button">
        <span>PLAY NOW</span>
        <span class="button-arrow">→</span>
      </a>

      <a href="screen.html" class="button button-secondary bounce-button">
        PROJECTOR SCREEN
      </a>

    </div>

    <div class="mini-message">
      <span>✦</span>
      LIVE GAMES • REAL PLAYERS • ONE WINNER
      <span>✦</span>
    </div>

    <p class="instagram">@mggsociety</p>

  </main>

</body>
</html>
